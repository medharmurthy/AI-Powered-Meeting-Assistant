[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verbatim"
version = "0.1.0"
description = "Verbatim: AI-powered meeting assistant"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.package-dir]
"" = "backend"

[tool.setuptools.packages.find]
where = ["backend"]
