[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verbatim"
version = "0.1.0"
description = "Verbatim: AI-powered meeting assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "av>=12.0.0",
    "fastapi>=0.115.0",
    "faster-whisper>=1.0.0",
    "httpx>=0.27.0",
    "jellyfish>=1.1.0",
    "jinja2>=3.1.4",
    "numpy>=1.26.0",
    "ollama>=0.4.0",
    "pydantic>=2.9.0",
    "pytest>=8.3.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.9.0",
    "uvicorn[standard]>=0.32.0",
]

[tool.setuptools.package-dir]
"" = "backend"

[tool.setuptools.packages.find]
where = ["backend"]
